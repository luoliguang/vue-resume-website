<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 — 登录</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      background: #000;
      color: #f5f5f7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      width: 360px;
    }
    .brand {
      text-align: center;
      margin-bottom: 40px;
    }
    .brand-mark {
      width: 52px;
      height: 52px;
      background: #1d1d1f;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    .brand-mark svg { color: #f5f5f7; }
    .brand h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: #f5f5f7;
    }
    .brand p {
      font-size: 13px;
      color: #86868b;
      margin-top: 4px;
    }
    .card {
      background: #1d1d1f;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      padding: 32px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #86868b;
      letter-spacing: .04em;
      margin-bottom: 8px;
    }
    input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      background: #000;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      color: #f5f5f7;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color .2s;
    }
    input[type="password"]:focus {
      border-color: rgba(255,255,255,0.3);
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      background: #f5f5f7;
      color: #000;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity .15s;
      letter-spacing: -0.1px;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button:not(:disabled):hover { opacity: 0.88; }
    .error {
      margin-top: 14px;
      padding: 10px 14px;
      background: rgba(255,59,48,0.1);
      border: 1px solid rgba(255,59,48,0.2);
      border-radius: 8px;
      color: #ff453a;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="wrap" x-data="login()" @keydown.enter="submit">
    <div class="brand">
      <div class="brand-mark">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
      </div>
      <h1>简历管理后台</h1>
      <p>Resume Admin Panel</p>
    </div>
    <div class="card">
      <label>管理员密码</label>
      <input type="password" x-model="password" placeholder="••••••••" autofocus>
      <button @click="submit" :disabled="loading">
        <span x-text="loading ? '验证中…' : '登录'"></span>
      </button>
      <div class="error" x-show="error" x-text="error"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script>
    function login() {
      return {
        password: '',
        error: '',
        loading: false,
        init() {
          if (localStorage.getItem('admin_token')) {
            window.location.href = '/admin/dashboard.html'
          }
        },
        async submit() {
          if (!this.password) return
          this.loading = true
          this.error = ''
          try {
            const res = await fetch('/api/admin/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ password: this.password }),
            })
            const data = await res.json()
            if (!res.ok) { this.error = data.error || '密码错误'; return }
            localStorage.setItem('admin_token', data.token)
            window.location.href = '/admin/dashboard.html'
          } catch {
            this.error = '无法连接到服务器'
          } finally {
            this.loading = false
          }
        },
      }
    }
  </script>
</body>
</html>
